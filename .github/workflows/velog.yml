name: Update Velog Posts

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다
  workflow_dispatch:         # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths:
      - ".github/workflows/velog.yml"
      - "scripts/update_velog.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README
        run: python scripts/update_velog.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "📝 Update recent Velog posts" && git push)
